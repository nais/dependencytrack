apiVersion: v1
kind: ConfigMap
metadata:
  name: dependencytrack-v5-runtime
data:
  CLOUD_SQL_CONNECTION_NAME: {{ required "cloudSqlProxy.connectionName is required" .Values.cloudSqlProxy.connectionName | quote }}
  DT_OIDC_ENABLED: {{ .Values.apiServerEnv.oidc.enabled | quote }}
  DT_OIDC_ISSUER: {{ required "apiServerEnv.oidc.issuer is required" .Values.apiServerEnv.oidc.issuer | quote }}
  DT_OIDC_CLIENT_ID: {{ required "apiServerEnv.oidc.clientId is required" .Values.apiServerEnv.oidc.clientId | quote }}
  DT_OIDC_USERNAME_CLAIM: {{ .Values.apiServerEnv.oidc.usernameClaim | quote }}
  DT_OIDC_USER_PROVISIONING: {{ .Values.apiServerEnv.oidc.userProvisioning | quote }}
  DT_CORS_ENABLED: {{ .Values.apiServerEnv.cors.enabled | quote }}
  DT_CORS_ALLOWED_ORIGINS: {{ required "apiServerEnv.cors.allowedOrigins is required" .Values.apiServerEnv.cors.allowedOrigins | quote }}
  DT_CORS_ALLOWED_METHODS: {{ .Values.apiServerEnv.cors.allowedMethods | quote }}
  DT_CORS_ALLOWED_HEADERS: {{ .Values.apiServerEnv.cors.allowedHeaders | quote }}
  DT_CORS_EXPOSED_HEADERS: {{ .Values.apiServerEnv.cors.exposedHeaders | quote }}
  DT_CORS_ALLOW_CREDENTIALS: {{ .Values.apiServerEnv.cors.allowCredentials | quote }}
  DT_CORS_MAX_AGE: {{ .Values.apiServerEnv.cors.maxAge | quote }}
  DT_DATASOURCE_POOL_MAX_LIFETIME_MS: {{ .Values.apiServerEnv.datasource.pool.maxLifetimeMs | quote }}
{{- if .Values.apiServerEnv.oidc.teamSynchronization }}
  DT_OIDC_TEAM_SYNCHRONIZATION: "true"
  DT_OIDC_TEAMS_CLAIM: {{ .Values.apiServerEnv.oidc.teamsClaim | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependencytrack-v5-frontend-runtime
data:
  API_BASE_URL: {{ required "app.frontend.apiBaseUrl is required" .Values.app.frontend.apiBaseUrl | quote }}
  OIDC_ISSUER: {{ required "frontendEnv.oidcIssuer is required" .Values.frontendEnv.oidcIssuer | quote }}
  OIDC_CLIENT_ID: {{ required "frontendEnv.oidcClientId is required" .Values.frontendEnv.oidcClientId | quote }}
